# Local development stack (Phase 1): Postgres, Redis, MinIO (S3 emulator).
# Usage: docker compose -f infra/docker-compose.yml up -d
name: vidgrab

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vidgrab
      POSTGRES_PASSWORD: vidgrab
      POSTGRES_DB: vidgrab
    ports:
      # Host port 5433 to avoid clashing with a local Postgres on 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vidgrab"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # Host port 6380 to avoid clashing with a local Redis on 6379.
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: vidgrab
      MINIO_ROOT_PASSWORD: vidgrabsecret
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Creates the bucket on first boot so the worker can upload immediately.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 vidgrab vidgrabsecret &&
      mc mb --ignore-existing local/vidgrab-downloads &&
      mc anonymous set download local/vidgrab-downloads &&
      echo 'bucket ready';
      "

volumes:
  pgdata:
  redisdata:
  miniodata:
